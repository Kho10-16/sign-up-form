<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LEFT: image sidebar -->
  <aside class="sidebar">
    <div class="logo-band">
      <img src="images/odin-lined.png" alt="Odin logo">
      <h1>ODIN</h1>
    </div>
    <p class="credit">
      Photo by <a href="https://unsplash.com/@halacious">Halacious</a> on
      <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a>
    </p>
  </aside>

  <!-- RIGHT: main content -->
  <main class="content">
    <section class="intro">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
      <p>Sign up <em>now</em> to get started.</p>
      <p>You <em>know</em> you want to.</p>
    </section>

    <form class="signup" id="signup-form">
      <h2>Let's do this!</h2>
      <div class="fields">
        <div class="field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first_name" required>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last_name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9\-+ ]{8,15}">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
        </div>
      </div>
    </form>

    <section class="actions">
      <button type="submit" form="signup-form">Create Account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
    </section>
  </main>
</body>
</html>
